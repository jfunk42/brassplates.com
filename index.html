<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brass Plates</title>
  <meta
    name="description"
    content="A static GitHub Pages site for scripture connections between the Book of Mormon and Come, Follow Me readings."
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">BrassPlates.com</p>
      <h1>Daily scripture connections</h1>
      <p class="lead">
        A simple study companion for collecting links between Book of Mormon passages and
        Come, Follow Me readings. Move day by day, jump to any date, and read both references
        without leaving the page.
      </p>
    </section>

    <section class="details">
      <div class="viewer-controls" aria-label="Date navigation">
        <button id="previous-day" class="nav-button" type="button">Previous day</button>

        <label class="date-picker">
          <span>Choose a date</span>
          <input id="selected-date" type="date">
        </label>

        <button id="next-day" class="nav-button" type="button">Next day</button>
      </div>

      <article id="entry-card" class="entry-card" hidden>
        <p id="entry-date" class="entry-date"></p>

        <p id="entry-thought" class="entry-thought"></p>

      <div class="iframe-grid">
        <article class="iframe-card">
          <a id="bom-link" class="reference-card iframe-reference" target="_blank" rel="noreferrer">
            <span class="reference-label">Book of Mormon</span>
            <strong id="bom-reference"></strong>
          </a>
          <iframe id="bom-frame" class="study-frame" title="Book of Mormon reference"></iframe>
        </article>

        <article class="iframe-card">
          <a id="cfm-link" class="reference-card iframe-reference" target="_blank" rel="noreferrer">
            <span class="reference-label">Come, Follow Me</span>
            <strong id="cfm-reference"></strong>
          </a>
          <iframe id="cfm-frame" class="study-frame" title="Come, Follow Me reference"></iframe>
        </article>
      </div>

      <p id="empty-state" class="empty-state" hidden></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
